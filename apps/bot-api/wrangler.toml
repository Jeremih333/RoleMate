name = "rolemate-app"
account_id = "9d1b271d6aec48ab5d8f595d1d3fac61"
main = "src/cloudflare.ts"
compatibility_date = "2026-07-28"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[assets]
directory = "../miniapp/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[alias]
fastify = "./src/edge/fastify.ts"
"@fastify/cookie" = "./src/edge/cookie.ts"
"@fastify/cors" = "./src/edge/cors.ts"
"@fastify/helmet" = "./src/edge/helmet.ts"
"@fastify/rate-limit" = "./src/edge/rate-limit.ts"
"@fastify/static" = "./src/edge/noop-plugin.ts"
"@fastify/swagger" = "./src/edge/noop-plugin.ts"
"@fastify/swagger-ui" = "./src/edge/noop-plugin.ts"

[[services]]
binding = "DATA_API"
service = "rolemate-data-api"

[triggers]
crons = ["* * * * *"]

[vars]
BOT_NAME = "RoleMate"
BOT_SHORT_DESCRIPTION = "Анонимный поиск со-ролевиков"
BOT_USERNAME = "r0lemate_bot"
MINI_APP_URL = "https://rolemate-app.carreljeremih.workers.dev"
PUBLIC_BASE_URL = "https://rolemate-app.carreljeremih.workers.dev"
OWNER_TELEGRAM_ID = "1040929628"
SUPPORT_URL = "https://t.me/odinnadsat"
PROMO_CHAT_URL = "https://t.me/piarchaticksss"
TELEGRAM_BOT_INFO = "{\"id\":8210973640,\"is_bot\":true,\"first_name\":\"RoleMate\",\"username\":\"r0lemate_bot\",\"can_join_groups\":true,\"can_read_all_group_messages\":false,\"supports_inline_queries\":false,\"can_connect_to_business\":false,\"has_main_web_app\":true}"
WELCOME_IMAGE_URL = "https://rolemate-app.carreljeremih.workers.dev/assets/telegram-bot-avatar.jpg"
D1_WORKER_URL = "https://rolemate-data-api.carreljeremih.workers.dev"
INTERNAL_SERVICE_ID = "rolemate-bot-api"
ALLOWED_ORIGINS = "https://rolemate-app.carreljeremih.workers.dev"
DEPLOYMENT_ENV = "production"
COMMIT_SHA = "20260828-custom-emoji"
