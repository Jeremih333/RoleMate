services:
  rolemate:
    build:
      context: .
      target: runtime
    env_file:
      - .env
    ports:
      - '${PORT:-3000}:3000'
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--spider', 'http://127.0.0.1:3000/health/ready']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
